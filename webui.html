<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DLD 产品查询器</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #7b8794;
      --accent: #2563eb;
      --border: #d9e2ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .search-bar { display: flex; gap: 8px; }
    #q {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
    }
    #q:focus { border-color: var(--accent); }
    button {
      padding: 10px 16px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .status { min-height: 24px; margin: 12px 2px; color: var(--muted); font-size: 13px; }
    .result {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .model { font-weight: 600; font-size: 15px; }
    .price { color: #b7791f; margin-left: 8px; }
    .remark { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .context { color: #52606d; font-size: 13px; margin-top: 4px; }
    .empty { padding: 24px; text-align: center; color: var(--muted); }
    @media (max-width: 520px) {
      .search-bar { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>DLD 产品查询器</h1>
    <p class="subtitle">关键词模糊拼配，快速定位报价表产品</p>
    <div class="search-bar">
      <input id="q" type="search" placeholder="输入关键词，如：曲面 gps" autofocus>
      <button class="primary" id="search-btn">搜索</button>
      <button id="all-btn">全部产品</button>
    </div>
    <div id="status" class="status"></div>
    <div id="results"></div>
  </main>
  <script>
    const q = document.getElementById("q");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function render(payload) {
      results.innerHTML = "";
      if (!payload.results.length) {
        status.textContent = "未命中任何产品，试试更短的关键词。";
        results.innerHTML = '<div class="empty">未命中任何产品</div>';
        return;
      }
      let statusText = "命中 " + payload.results.length + " 条（" + payload.mode + "）";
      if (payload.mode === "OR") {
        statusText = "未同时包含全部关键词，已放宽为任一命中。" + statusText;
      }
      status.textContent = statusText;
      for (const item of payload.results) {
        appendResult(item, item.context ? esc(item.context) : "");
      }
    }

    function appendResult(item, contextHtml) {
      const div = document.createElement("div");
      div.className = "result";
      let html = '<div class="model">' + esc(item.model);
      if (item.price != null) html += '<span class="price">¥' + esc(item.price) + "</span>";
      html += "</div>";
      if (item.remark) html += '<div class="remark">' + esc(item.remark).replace(/\n/g, " · ") + "</div>";
      if (contextHtml) html += '<div class="context">' + contextHtml + "</div>";
      div.innerHTML = html;
      results.appendChild(div);
    }

    async function search(keywords) {
      status.textContent = "查询中…";
      const resp = await fetch("/api/search?q=" + encodeURIComponent(keywords));
      render(await resp.json());
    }

    async function allProducts() {
      status.textContent = "查询中…";
      const resp = await fetch("/api/products");
      const data = await resp.json();
      results.innerHTML = "";
      status.textContent = "共 " + data.products.length + " 个产品";
      for (const item of data.products) {
        appendResult(item, item.app ? "APP：" + esc(item.app) : "");
      }
    }

    document.getElementById("search-btn").addEventListener("click", () => search(q.value.trim()));
    document.getElementById("all-btn").addEventListener("click", allProducts);
    q.addEventListener("keydown", e => {
      if (e.key === "Enter") search(q.value.trim());
    });
  </script>
</body>
</html>
